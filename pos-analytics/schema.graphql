# Raw immutable event entities consumed by @orbs-network/pos-analytics-lib.
# One entity type per event the lib currently fetches via eth_getLogs.

# --- Stake ---

type Staked @entity(immutable: true) {
  id: Bytes!
  stakeOwner: Bytes! # address indexed
  amount: BigInt! # uint256
  totalStakedAmount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
  txIndex: BigInt!
}

type Restaked @entity(immutable: true) {
  id: Bytes!
  stakeOwner: Bytes! # address indexed
  amount: BigInt! # uint256
  totalStakedAmount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
  txIndex: BigInt!
}

type Unstaked @entity(immutable: true) {
  id: Bytes!
  stakeOwner: Bytes! # address indexed
